name: Go contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Verify exact revision and toolchain
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          echo "Checked revision: $EXPECTED_REVISION"
          go version
      - name: Download pinned modules
        run: go mod download all
      - name: Prepare pinned TypeScript semantic compiler
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/bittype-typescript" --ignore-scripts --no-audit --no-fund typescript@5.9.3 @types/node@24.0.0
          echo "BITTYPE_TYPESCRIPT_NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "BITTYPE_TYPESCRIPT_MODULE=$RUNNER_TEMP/bittype-typescript/node_modules/typescript/lib/typescript.js" >> "$GITHUB_ENV"
      - name: Prepare pinned Rust semantic compiler
        shell: bash
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustc-dev --component llvm-tools-preview --component rustfmt
          sysroot="$(rustc +1.90.0 --print sysroot)"
          echo "BITTYPE_RUST_SYSROOT=$sysroot" >> "$GITHUB_ENV"
          echo "BITTYPE_RUST_HELPER=$RUNNER_TEMP/bittype-rust/release/bittype-rust-semantics" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/bittype-rust" >> "$GITHUB_ENV"
          cargo +1.90.0 fetch --locked --manifest-path internal/rustsem/helper/Cargo.toml
      - name: Save Rust dependency and formatting corrections
        shell: bash
        run: |
          cargo +1.90.0 fmt --manifest-path internal/rustsem/helper/Cargo.toml
          git diff --binary -- internal/rustsem/helper > "$RUNNER_TEMP/rust-helper.patch"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: rust-helper-patch
          path: ${{ runner.temp }}/rust-helper.patch
          retention-days: 7
      - name: Build and typecheck Rust semantic helper
        shell: bash
        run: |
          RUSTC_BOOTSTRAP=1 RUSTFLAGS="-C link-arg=-Wl,-rpath,$BITTYPE_RUST_SYSROOT/lib" cargo +1.90.0 build --release --locked --manifest-path internal/rustsem/helper/Cargo.toml
      - name: Save dependency checksum corrections
        shell: bash
        run: git diff --binary -- go.mod go.sum > "$RUNNER_TEMP/go-mod.patch"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: go-mod-patch
          path: ${{ runner.temp }}/go-mod.patch
          retention-days: 7
      - name: Check Go formatting without changing source
        id: formatting
        shell: bash
        run: |
          python3 - <<'PY'
          import difflib
          import os
          from pathlib import Path
          import subprocess

          paths = subprocess.check_output(
              ["git", "ls-files", "-z", "*.go"]
          ).decode().split("\0")
          patches = []
          for name in filter(None, paths):
              original = Path(name).read_bytes()
              formatted = subprocess.run(
                  ["gofmt"], input=original, capture_output=True, check=True
              ).stdout
              if original != formatted:
                  print("Formatting required:", name, flush=True)
                  patches.extend(difflib.unified_diff(
                      original.decode().splitlines(keepends=True),
                      formatted.decode().splitlines(keepends=True),
                      fromfile="a/" + name, tofile="b/" + name
                  ))
          if patches:
              patch = Path(os.environ["RUNNER_TEMP"]) / "gofmt.patch"
              patch.write_text("".join(patches), encoding="utf-8")
              raise SystemExit("Go formatting check failed; see gofmt-patch artifact")
          print("All committed Go files are formatted.")
          PY
      - name: Save formatting corrections
        if: failure() && steps.formatting.outcome == 'failure'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gofmt-patch
          path: ${{ runner.temp }}/gofmt.patch
          if-no-files-found: ignore
          retention-days: 7
      - name: Check public contracts and production dependencies
        if: success() || (failure() && steps.formatting.outcome == 'failure')
        run: >-
          python3 tools/provider-matrix/capture.py run --root "$GITHUB_WORKSPACE"
          --output "$RUNNER_TEMP/capability-observations/contracts" --command-id contracts
          --env BITTYPE_TYPESCRIPT_NODE --env BITTYPE_TYPESCRIPT_MODULE
          --env BITTYPE_RUST_HELPER --env BITTYPE_RUST_SYSROOT
          -- go test -count=1 -json ./...
      - name: Vet Go packages
        if: success() || (failure() && steps.formatting.outcome == 'failure')
        run: go vet ./...
      - name: Typecheck TypeScript semantic helper
        if: success() || (failure() && steps.formatting.outcome == 'failure')
        shell: bash
        run: |
          node "$RUNNER_TEMP/bittype-typescript/node_modules/typescript/lib/tsc.js" --allowJs --checkJs --noEmit --target es2020 --module commonjs --baseUrl "$RUNNER_TEMP/bittype-typescript/node_modules" --typeRoots "$RUNNER_TEMP/bittype-typescript/node_modules/@types" internal/typescriptsem/compiler.cjs
      - name: Check syntax engine concurrency
        if: success() || (failure() && steps.formatting.outcome == 'failure')
        run: >-
          python3 tools/provider-matrix/capture.py run --root "$GITHUB_WORKSPACE"
          --output "$RUNNER_TEMP/capability-observations/syntax-race" --command-id syntax-race
          --env BITTYPE_TYPESCRIPT_NODE --env BITTYPE_TYPESCRIPT_MODULE
          --env BITTYPE_RUST_HELPER --env BITTYPE_RUST_SYSROOT
          -- go test -race -count=1 -json -run '^(TestGenerationPlanConcurrent|TestEngineConcurrent|TestGoSemanticConcurrent|TestTypeScriptSemanticConcurrent|TestRustSemanticConcurrent)' ./integration/go
      - name: Check joint verification concurrency
        if: success() || (failure() && steps.formatting.outcome == 'failure')
        run: >-
          python3 tools/provider-matrix/capture.py run --root "$GITHUB_WORKSPACE"
          --output "$RUNNER_TEMP/capability-observations/joint-race" --command-id joint-race
          -- go test -race -count=1 -json -run '^TestJointConcurrentChecks$' ./verification/integration/go
      - name: Check bounded process output concurrency
        if: success() || (failure() && steps.formatting.outcome == 'failure')
        run: >-
          python3 tools/provider-matrix/capture.py run --root "$GITHUB_WORKSPACE"
          --output "$RUNNER_TEMP/capability-observations/process-race" --command-id process-race
          -- go test -race -count=1 -json ./internal/processoutput ./tools/provider-matrix/report/go
      - name: Check an independently installed public consumer
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GOAUTH: 'off'
          GOPRIVATE: ''
          GONOPROXY: ''
          GONOSUMDB: ''
          GOWORK: 'off'
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_TERMINAL_PROMPT: '0'
          GOMODCACHE: ${{ runner.temp }}/installed-modules
          GOCACHE: ${{ runner.temp }}/installed-build
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/installed-consumer"
          cp integration/go/testdata/installed/*_test.go "$RUNNER_TEMP/installed-consumer/"
          cd "$RUNNER_TEMP/installed-consumer"
          go mod init installed.consumer
          go get "github.com/Bitspark/bittype@$EXPECTED_REVISION" github.com/Bitspark/horos/core/go@v0.10.2 github.com/bitspark/ontos@v0.16.0 github.com/Bitspark/logos-contract/contract/go@v0.26.0
          test "$(go mod download -json github.com/Bitspark/bittype | python3 -c 'import json,sys; print(json.load(open(json.load(sys.stdin)["Info"]))["Origin"]["Hash"])')" = "$EXPECTED_REVISION"
          test "$(go list -m -f '{{.Version}}' github.com/Bitspark/horos/core/go)" = v0.10.2
          test "$(go list -m -f '{{.Version}}' github.com/bitspark/ontos)" = v0.16.0
          test "$(go mod download -json github.com/Bitspark/logos-contract/contract/go | python3 -c 'import json,sys; info=json.load(open(json.load(sys.stdin)["Info"])); print(info["Version"], info["Origin"]["Hash"])')" = "v0.26.0 97b738945c9a1fe4c85bddcf2313726e62af0965"
          test -z "$(go list -m -f '{{if .Replace}}{{.Path}}{{end}}' all)"
          python3 "$GITHUB_WORKSPACE/tools/provider-matrix/capture.py" run --root "$GITHUB_WORKSPACE" \
            --cwd "$RUNNER_TEMP/installed-consumer" --harness installed.consumer \
            --output "$RUNNER_TEMP/capability-observations/installed-consumer" --command-id installed-consumer \
            -- go test -mod=readonly -count=1 -json ./...
          go test -mod=readonly -count=1 -v -run '^TestGeneratedPageUsesActualTransformerOutput$' github.com/Bitspark/bittype/integration/go
          go test -mod=readonly -count=1 -v github.com/Bitspark/bittype/verification/integration/go github.com/Bitspark/bittype/verification/logos/go
      - name: Fuzz native text boundaries
        if: success() || (failure() && steps.formatting.outcome == 'failure')
        env:
          GOMAXPROCS: '2'
        run: >-
          python3 tools/provider-matrix/capture.py run --root "$GITHUB_WORKSPACE"
          --output "$RUNNER_TEMP/capability-observations/native-fuzz" --command-id native-fuzz
          --env GOMAXPROCS
          -- go test -json -run='^$' -fuzz=FuzzNativeText -fuzztime=20s ./integration/go
      - name: Fuzz Horos source boundaries
        if: success() || (failure() && steps.formatting.outcome == 'failure')
        env:
          GOMAXPROCS: '2'
        run: >-
          python3 tools/provider-matrix/capture.py run --root "$GITHUB_WORKSPACE"
          --output "$RUNNER_TEMP/capability-observations/horos-fuzz" --command-id horos-fuzz
          --env GOMAXPROCS
          -- go test -json -run='^$' -fuzz=FuzzSourceRoundTrip -fuzztime=20s ./parse/syntax/horos/provider/go
      - name: Save failing fuzz cases
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-fuzz-corpus
          path: |
            integration/go/testdata/fuzz/
            parse/syntax/horos/provider/go/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify committed dependency metadata
        run: git diff --exit-code -- go.mod go.sum internal/rustsem/helper
      - name: Render invocation capability observations
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          status=0
          for command in contracts syntax-race joint-race process-race installed-consumer native-fuzz horos-fuzz; do
            directory="$RUNNER_TEMP/capability-observations/$command"
            if [ ! -f "$directory/invocation.json" ]; then continue; fi
            flags=()
            case "$command" in syntax-race|joint-race|process-race) flags=(--build-flag=-race);; esac
            # This context is captured afresh from the reporting checkout. In
            # particular it never adopts the installed consumer's harness.
            python3 tools/provider-matrix/capture.py context --root "$GITHUB_WORKSPACE" \
              --output "$directory/source-context.json" "${flags[@]}" || status=1
            go run ./tools/provider-matrix/go -results "$directory/invocation.json" \
              -context "$directory/source-context.json" -execution-output "$directory/report.md" -execution-overview "$directory/overview.md" || status=1
          done
          exit "$status"
      - name: Upload invocation capability observations
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: capability-observations-contracts-${{ github.run_attempt }}
          path: ${{ runner.temp }}/capability-observations/
          if-no-files-found: ignore
          retention-days: 7
      - name: Generate reviewable static capability reports
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          go run ./tools/provider-matrix/go
          mkdir -p "$RUNNER_TEMP/capability-static"
          cp docs/providers.md docs/provider-capabilities.md docs/language-support.md "$RUNNER_TEMP/capability-static/"
      - name: Upload generated static capability reports
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: capability-static-${{ github.run_attempt }}
          path: ${{ runner.temp }}/capability-static/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record passing revision
        shell: bash
        run: |
          echo "PASS $EXPECTED_REVISION: Go 1.27.3 formatting, contract/dependency tests, vet, engine/joint verification and bounded process output race checks and native/Horos text fuzzing." >> "$GITHUB_STEP_SUMMARY"

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      GOTOOLCHAIN: local
      BITTYPE_NATIVE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache: false
      - name: Prepare pinned native compilers
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          npm install --prefix "$RUNNER_TEMP/bittype-tools" --ignore-scripts --no-audit --no-fund typescript@5.9.3
          echo "$RUNNER_TEMP/bittype-tools/node_modules/.bin" >> "$GITHUB_PATH"
          echo "BITTYPE_TYPESCRIPT_NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "BITTYPE_TYPESCRIPT_MODULE=$RUNNER_TEMP/bittype-tools/node_modules/typescript/lib/typescript.js" >> "$GITHUB_ENV"
          docker pull rust:1.90.0
          docker pull gcc:14.2.0
          docker run --rm --network=none rust:1.90.0 rustc --version
          docker run --rm --network=none gcc:14.2.0 g++ --version
      - name: Compile independent AST, parsed and generated native fixtures
        run: >-
          python3 tools/provider-matrix/capture.py run --root "$GITHUB_WORKSPACE"
          --output "$RUNNER_TEMP/capability-observations/native" --command-id native
          --env BITTYPE_NATIVE --env BITTYPE_TYPESCRIPT_NODE --env BITTYPE_TYPESCRIPT_MODULE
          -- go test -count=1 -json -run '^(TestNativeCompilerFixtures|TestDeclarativeIndependentHostedGoCompiler|TestGeneratedPaginationCompilers|TestListOverrideComposesThroughGenericPage|TestLibraryOwnedCellAvoidsBodyExpansion)$' ./integration/go
      - name: Render native invocation capability observations
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          directory="$RUNNER_TEMP/capability-observations/native"
          if [ ! -f "$directory/invocation.json" ]; then exit 0; fi
          status=0
          python3 tools/provider-matrix/capture.py context --root "$GITHUB_WORKSPACE" \
            --output "$directory/source-context.json" || status=1
          go run ./tools/provider-matrix/go -results "$directory/invocation.json" \
            -context "$directory/source-context.json" -execution-output "$directory/report.md" -execution-overview "$directory/overview.md" || status=1
          exit "$status"
      - name: Upload native invocation capability observations
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: capability-observations-native-${{ github.run_attempt }}
          path: ${{ runner.temp }}/capability-observations/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record passing native revision
        run: echo "PASS $EXPECTED_REVISION native fixtures - Go 1.27.3, TypeScript 5.9.3 ES2020, Rust 1.90.0 edition 2024, GCC 14.2.0 C++20." >> "$GITHUB_STEP_SUMMARY"
