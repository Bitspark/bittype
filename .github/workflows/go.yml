name: Go contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Verify exact revision and toolchain
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          echo "Checked revision: $EXPECTED_REVISION"
          go version
      - name: Download pinned modules
        run: go mod download all
      - name: Prepare pinned TypeScript semantic compiler
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/bittype-typescript" --ignore-scripts --no-audit --no-fund typescript@5.9.3 @types/node@24.0.0
          echo "BITTYPE_TYPESCRIPT_NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "BITTYPE_TYPESCRIPT_MODULE=$RUNNER_TEMP/bittype-typescript/node_modules/typescript/lib/typescript.js" >> "$GITHUB_ENV"
      - name: Prepare pinned Rust semantic compiler
        shell: bash
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustc-dev --component llvm-tools-preview --component rustfmt
          sysroot="$(rustc +1.90.0 --print sysroot)"
          echo "BITTYPE_RUST_SYSROOT=$sysroot" >> "$GITHUB_ENV"
          echo "BITTYPE_RUST_HELPER=$RUNNER_TEMP/bittype-rust/release/bittype-rust-semantics" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/bittype-rust" >> "$GITHUB_ENV"
          cargo +1.90.0 generate-lockfile --manifest-path internal/rustsem/helper/Cargo.toml
          git add -N internal/rustsem/helper/Cargo.lock
      - name: Save Rust dependency and formatting corrections
        shell: bash
        run: |
          cargo +1.90.0 fmt --manifest-path internal/rustsem/helper/Cargo.toml
          git diff --binary -- internal/rustsem/helper > "$RUNNER_TEMP/rust-helper.patch"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: rust-helper-patch
          path: ${{ runner.temp }}/rust-helper.patch
          retention-days: 7
      - name: Build and typecheck Rust semantic helper
        shell: bash
        run: |
          RUSTC_BOOTSTRAP=1 RUSTFLAGS="-C link-arg=-Wl,-rpath,$BITTYPE_RUST_SYSROOT/lib" cargo +1.90.0 build --release --locked --manifest-path internal/rustsem/helper/Cargo.toml
          git diff --exit-code -- internal/rustsem/helper
      - name: Save dependency checksum corrections
        shell: bash
        run: git diff --binary -- go.mod go.sum > "$RUNNER_TEMP/go-mod.patch"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: go-mod-patch
          path: ${{ runner.temp }}/go-mod.patch
          retention-days: 7
      - name: Check Go formatting without changing source
        id: formatting
        shell: bash
        run: |
          python3 - <<'PY'
          import difflib
          import os
          from pathlib import Path
          import subprocess

          paths = subprocess.check_output(
              ["git", "ls-files", "-z", "*.go"]
          ).decode().split("\0")
          patches = []
          for name in filter(None, paths):
              original = Path(name).read_bytes()
              formatted = subprocess.run(
                  ["gofmt"], input=original, capture_output=True, check=True
              ).stdout
              if original != formatted:
                  print("Formatting required:", name, flush=True)
                  patches.extend(difflib.unified_diff(
                      original.decode().splitlines(keepends=True),
                      formatted.decode().splitlines(keepends=True),
                      fromfile="a/" + name, tofile="b/" + name
                  ))
          if patches:
              patch = Path(os.environ["RUNNER_TEMP"]) / "gofmt.patch"
              patch.write_text("".join(patches), encoding="utf-8")
              raise SystemExit("Go formatting check failed; see gofmt-patch artifact")
          print("All committed Go files are formatted.")
          PY
      - name: Save formatting corrections
        if: failure() && steps.formatting.outcome == 'failure'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gofmt-patch
          path: ${{ runner.temp }}/gofmt.patch
          if-no-files-found: ignore
          retention-days: 7
      - name: Check public contracts and production dependencies
        if: success() || (failure() && steps.formatting.outcome == 'failure')
        run: go test -count=1 -v ./...
      - name: Vet Go packages
        if: success() || (failure() && steps.formatting.outcome == 'failure')
        run: go vet ./...
      - name: Typecheck TypeScript semantic helper
        if: success() || (failure() && steps.formatting.outcome == 'failure')
        shell: bash
        run: |
          node "$RUNNER_TEMP/bittype-typescript/node_modules/typescript/lib/tsc.js" --allowJs --checkJs --noEmit --target es2020 --module commonjs --baseUrl "$RUNNER_TEMP/bittype-typescript/node_modules" --typeRoots "$RUNNER_TEMP/bittype-typescript/node_modules/@types" internal/typescriptsem/compiler.cjs
      - name: Check syntax engine concurrency
        if: success() || (failure() && steps.formatting.outcome == 'failure')
        run: go test -race -count=1 -run '^(TestEngineConcurrent|TestGoSemanticConcurrent|TestTypeScriptSemanticConcurrent|TestRustSemanticConcurrent)' ./integration/go
      - name: Check joint verification concurrency
        if: success() || (failure() && steps.formatting.outcome == 'failure')
        run: go test -race -count=1 -run '^TestJointConcurrentChecks$' ./verification/integration/go
      - name: Check an independently installed public consumer
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
          GOPRIVATE: ''
          GONOPROXY: ''
          GONOSUMDB: ''
          GOWORK: 'off'
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_TERMINAL_PROMPT: '0'
          GOMODCACHE: ${{ runner.temp }}/installed-modules
          GOCACHE: ${{ runner.temp }}/installed-build
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/installed-consumer"
          cp integration/go/testdata/installed/*_test.go "$RUNNER_TEMP/installed-consumer/"
          cd "$RUNNER_TEMP/installed-consumer"
          go mod init installed.consumer
          go get "github.com/Bitspark/bittype@$EXPECTED_REVISION" github.com/Bitspark/horos/core/go@v0.10.2 github.com/bitspark/ontos@v0.16.0 github.com/Bitspark/logos-contract/contract/go@v0.25.0
          test "$(go mod download -json github.com/Bitspark/bittype | python3 -c 'import json,sys; print(json.load(open(json.load(sys.stdin)["Info"]))["Origin"]["Hash"])')" = "$EXPECTED_REVISION"
          test "$(go list -m -f '{{.Version}}' github.com/Bitspark/horos/core/go)" = v0.10.2
          test "$(go list -m -f '{{.Version}}' github.com/bitspark/ontos)" = v0.16.0
          test "$(go mod download -json github.com/Bitspark/logos-contract/contract/go | python3 -c 'import json,sys; print(json.load(open(json.load(sys.stdin)["Info"]))["Origin"]["Hash"])')" = eef2c26467bee408f36a8efee38ad99d89ea5b6b
          test -z "$(go list -m -f '{{if .Replace}}{{.Path}}{{end}}' all)"
          go test -mod=readonly -count=1 -v ./...
      - name: Fuzz native text boundaries
        if: success() || (failure() && steps.formatting.outcome == 'failure')
        env:
          GOMAXPROCS: '2'
        run: go test -run='^$' -fuzz=FuzzNativeText -fuzztime=20s ./integration/go
      - name: Fuzz Horos source boundaries
        if: success() || (failure() && steps.formatting.outcome == 'failure')
        env:
          GOMAXPROCS: '2'
        run: go test -run='^$' -fuzz=FuzzSourceRoundTrip -fuzztime=20s ./parse/syntax/horos/go
      - name: Save failing fuzz cases
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-fuzz-corpus
          path: |
            integration/go/testdata/fuzz/
            parse/syntax/horos/go/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify committed dependency metadata
        run: git diff --exit-code -- go.mod go.sum
      - name: Record passing revision
        shell: bash
        run: |
          echo "PASS $EXPECTED_REVISION: Go 1.27.3 formatting, contract/dependency tests, vet, engine/joint verification race checks and native/Horos text fuzzing." >> "$GITHUB_STEP_SUMMARY"

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      GOTOOLCHAIN: local
      BITTYPE_NATIVE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache: false
      - name: Prepare pinned native compilers
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          npm install --prefix "$RUNNER_TEMP/bittype-tools" --ignore-scripts --no-audit --no-fund typescript@5.9.3
          echo "$RUNNER_TEMP/bittype-tools/node_modules/.bin" >> "$GITHUB_PATH"
          docker pull rust:1.90.0
          docker pull gcc:14.2.0
          docker run --rm --network=none rust:1.90.0 rustc --version
          docker run --rm --network=none gcc:14.2.0 g++ --version
      - name: Compile independent AST and parsed native fixtures
        # Horos-owned pagination/compiler qualification now runs in its separate
        # tooling/bittype integration module. This module retains generic/native fixtures.
        run: go test -count=1 -v -run '^(TestNativeCompilerFixtures|TestGenerationSPIHostedGoCompiler)$' ./integration/go
      - name: Record passing native revision
        run: echo "PASS $EXPECTED_REVISION native fixtures - Go 1.27.3, TypeScript 5.9.3 ES2020, Rust 1.90.0 edition 2024, GCC 14.2.0 C++20." >> "$GITHUB_STEP_SUMMARY"
